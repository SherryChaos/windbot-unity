name: sync-upstream

on:
  workflow_dispatch:
  schedule:
    # Every Monday 03:00 UTC
    - cron: '0 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upm
        uses: actions/checkout@v4
        with:
          ref: upm
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/IceYGO/windbot.git
          git fetch upstream master

      - name: Merge upstream into a sync branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "sync/upstream-${GITHUB_RUN_ID}"
          if ! git merge upstream/master --no-edit; then
            echo "::error::merge conflict: resolve locally, push upm, then rerun"
            git merge --abort
            exit 1
          fi

      - name: Regenerate embedded resources and .meta
        run: |
          python Tools/gen_windbot_resources.py
          python Tools/gen_meta.py --prune
          git add -A
          git diff --cached --quiet || git commit -m "regenerate windbot resources"

      - name: Open PR to upm
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "sync/upstream-${{ github.run_id }}"
          base: upm
          title: "sync upstream WindBot"
          body: |
            自动同步 `IceYGO/windbot` master，并重新生成：
            - `Unity/WindBotResources.g.cs`（Decks/Dialogs 内嵌资源）
            - 新增/删除文件的 `.meta`

            合并前请本地跑一遍桌面版 `msbuild` + Unity 口径编译检查。
